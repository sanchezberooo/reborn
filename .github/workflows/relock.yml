# GEÇİCİ iş akışı (Paket B / TASK B1.4). package-lock.json'ı GERÇEK Linux
# üzerinde bir kez yeniden üretir ve artifact olarak yükler; indirilen dosya
# repoya commit'lenince bu dosya SİLİNİR.
#
# Neden gerekli: lockfile Windows'ta üretildiği için Linux'a özgü optional
# dependency'ler (@emnapi/*) eksik ve `npm ci` reddediyor. Windows'tan
# `--os=linux --cpu=x64` ile üretmek yetmiyor (hoisted @emnapi girdileri yine
# eksik kalıyor); sıfırdan re-resolve ise ilgisiz paket sürümlerini
# oynatıyor. Mevcut lockfile'ı GİRDİ olarak alıp Linux'ta tamamlamak, sürüm
# oynatmayan tek yol.
name: Relock (temporary)

on:
  workflow_dispatch:

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --package-lock-only: node_modules'a dokunmaz, yalnız lock ağacını
      # çözer. Mevcut lockfile girdi olarak kullanılır — npm var olan
      # çözümleri korur ve yalnız eksik Linux girdilerini ekler.
      - run: npm install --package-lock-only

      - run: git --no-pager diff --stat package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock-linux
          path: package-lock.json
