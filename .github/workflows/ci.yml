name: CI

on:
  push:
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci: lockfile'a BİREBİR sadık kurulum — reprodüksiyon garantisi
      # buna bağlı (npm install lockfile'ı sessizce tamamlayabilir).
      #
      # Eskiden npm install kullanılıyordu çünkü lockfile Windows'ta
      # üretilmişti ve Linux'a özgü optional dependency'ler eksikti. Dosya
      # bir kez GERÇEK Linux'ta (geçici relock iş akışı, ubuntu-latest)
      # `npm install --package-lock-only` ile tamamlandı: 8 girdi eklendi
      # (@emnapi/* ve @napi-rs/wasm-runtime'ın wasm32-wasi zincirleri),
      # hiçbir paket silinmedi, hiçbir sürüm/resolved/integrity değişmedi.
      # Lockfile'ı Windows'ta yeniden üretmek bu girdileri TEKRAR düşürür —
      # relock her zaman Linux'ta yapılmalı.
      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run build
