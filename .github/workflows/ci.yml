name: CI

on:
  push:
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci: lockfile'a BİREBİR sadık kurulum — reprodüksiyon garantisi
      # buna bağlı (npm install lockfile'ı sessizce tamamlayabilir).
      # Eskiden npm install kullanılıyordu çünkü Windows'ta üretilen lock
      # dosyasında Linux'a özgü optional dependency'ler (@emnapi/* ve
      # @tailwindcss/oxide-wasm32-wasi'nin WASM fallback'i) eksikti; lockfile
      # `npm install --package-lock-only --os=linux --cpu=x64` ile bir kez
      # yeniden üretildi ve o 6 girdi eklendi. Hiçbir paketin sürümü,
      # resolved adresi veya integrity'si değişmedi.
      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run build
