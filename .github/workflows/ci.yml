name: CI

on:
  push:
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci reddediyor: package-lock.json'daki bazı optional dependency
      # girdileri (@emnapi/* — bge-m3'ün ONNX runtime'ının Linux'a özgü WASM
      # fallback'i) yalnızca Linux'ta gerekiyor ve Windows'ta üretilen lock
      # dosyasında eksik. npm install lockfile'ı gerektiği gibi tamamlar;
      # hiçbir dependency versiyonu veya uygulama kodu değişmiyor.
      - run: npm install

      - run: npm test

      - run: npm run lint

      - run: npm run build
